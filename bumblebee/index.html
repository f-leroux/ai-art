  :root { --bg: #07060f; --fg: #eaf6ff; --muted: rgba(234,246,255,0.6); --accent: #19e6ff; --hot: #ff2bd6; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: "Orbitron", "Share Tech Mono", ui-monospace, monospace; }
  body { display: grid; place-items: center; overflow: hidden; }
  .stage { position: relative; width: 100vw; height: 100vh; display: grid; place-items: center; }
  canvas { display: block; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; background: #000; }
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgba(20,10,40,0.6), rgba(0,0,0,0.88)); transition: opacity 0.5s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .card { text-align: center; display: grid; gap: 18px; padding: 24px; max-width: 640px; }
  .card h1 { font-weight: 800; font-size: clamp(20px, 3.4vw, 38px); letter-spacing: 0.14em; margin: 0; text-transform: uppercase; color: var(--accent); text-shadow: 0 0 24px rgba(25,230,255,0.6); }
  .card p { margin: 0; color: var(--muted); font-family: "Share Tech Mono", ui-monospace, monospace; font-size: 15px; line-height: 1.6; }
  .card button { justify-self: center; background: transparent; color: var(--fg); border: 1px solid rgba(25,230,255,0.6); padding: 14px 34px; font: inherit; font-size: 15px; letter-spacing: 0.25em; text-transform: uppercase; cursor: pointer; }
  .card button:hover, .card button:focus-visible { border-color: var(--hot); color: var(--hot); outline: none; box-shadow: 0 0 20px rgba(255,43,214,0.4); }
  .card label { color: var(--muted); font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; font-family: "Share Tech Mono", monospace; }

  const ex = -20 + Math.sin(F.t * 3) * 30; glow(ex, -5, 60, RD, 0.7 + 0.3 * lunge); ctx.fillStyle = rgba(WH, 0.95); ctx.beginPath(); ctx.ellipse(ex, -5, 16, 10, 0, 0, TAU); ctx.fill();
  // paddle arm reaching toward the target
  const ang = Math.atan2(ty - y, tx - x) / s;
  const reach = 160 + lunge * 320;
  ctx.rotate(Math.atan2(ty - y, tx - x));
  neonPath([[100, 0], [reach, 0]], RD, 5, 1);
  ctx.translate(reach, 0);
  const mesh = 80 + lunge * 30;
  fillDark([[0, -mesh], [mesh * 1.4, -mesh], [mesh * 1.4, mesh], [0, mesh]], 0.5, [30, 6, 12]);
  neonPath([[0, -mesh], [mesh * 1.4, -mesh], [mesh * 1.4, mesh], [0, mesh]], RD, 3, 1, true);
  ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = rgba(RD, 0.5); ctx.lineWidth = 1.5; ctx.beginPath();
  for (let k = 1; k < 6; k++) { ctx.moveTo(k * mesh * 0.233, -mesh); ctx.lineTo(k * mesh * 0.233, mesh); ctx.moveTo(0, -mesh + k * mesh / 3); ctx.lineTo(mesh * 1.4, -mesh + k * mesh / 3); }
  ctx.stroke(); ctx.globalCompositeOperation = 'source-over';
  void ang;
  ctx.restore();
}
function sceneGlide(F, u, C) {
  // the soft passage: above the clouds, the city below, a breath before the finale
  const T = F.t;
  ctx.fillStyle = '#05050f'; ctx.fillRect(0, 0, W, H);
  // moon
  glow(W * 0.72, H * 0.3, 420, VI, 0.35); ctx.fillStyle = rgba([220, 210, 255], 0.9); ctx.beginPath(); ctx.arc(W * 0.72, H * 0.3, 150, 0, TAU); ctx.fill();
  ctx.fillStyle = rgba([150, 130, 220], 0.35); for (let k = 0; k < 6; k++) { ctx.beginPath(); ctx.arc(W * 0.72 + Math.cos(k * 2.1) * 90, H * 0.3 + Math.sin(k * 1.7) * 80, 14 + k * 5, 0, TAU); ctx.fill(); }
  // stars
  ctx.fillStyle = rgba(WH, 0.7); for (let k = 0; k < 120; k++) { const tw = 0.5 + 0.5 * Math.sin(T * 2 + k); ctx.globalAlpha = tw * 0.8; ctx.beginPath(); ctx.arc(ihash(k, 1, 80) * W, ihash(k, 2, 80) * H * 0.55, 1 + ihash(k, 3, 80) * 1.5, 0, TAU); ctx.fill(); } ctx.globalAlpha = 1;
  // city grid far below, seen through the clouds
  ctx.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 400; k++) { const x = ((ihash(k, 4, 80) * W * 2 - T * 60) % W + W) % W, y = H * 0.7 + ihash(k, 5, 80) * H * 0.3; const col = ihash(k, 6, 80) < 0.5 ? CY : MG; ctx.fillStyle = rgba(col, 0.25 + 0.4 * noise2(T + k, 2)); ctx.fillRect(x, y, 3, 3); }
  ctx.globalCompositeOperation = 'source-over';
  // cloud layers with neon-lit edges
  for (let layer = 0; layer < 3; layer++) {
    const y0 = H * (0.62 + layer * 0.1), speed = 40 + layer * 50;
    const pts = [[0, H]]; for (let x = 0; x <= W; x += 30) pts.push([x, y0 + (noise2(x * 0.002 + T * speed * 0.0005 + layer * 9, layer) - 0.5) * 120]); pts.push([W, H]);
    fillDark(pts, 0.85, [12, 10, 28]);
    neonPath(pts.slice(1, -1), layer === 0 ? VI : layer === 1 ? MG : CY, 1.5, 0.35);
  }
  // the drone, small, gliding, package glowing
  const dx = W * 0.3 + u * W * 0.25, dy = H * 0.45 + Math.sin(T * 1.2) * 20 - (F.alt - 0.5) * 100;
  trail(F, (t, k) => dx - k * 14, (t) => H * 0.45 + Math.sin(t * 1.2) * 20 - (altAt(t) - 0.5) * 100, 30, 0.04, CY);
  drone(F, dx, dy, 0.7, 0.02);
  hud(F, 'ABOVE THE CLOUD LAYER', 'ROUTE CLEAR');
}
function sceneClimb(F, u, C) {
  // the ascending runs: straight up the tower to the hive; the dock opens on the final chord
  const T = F.t;
  ctx.fillStyle = '#05040c'; ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H * 0.3, f = 1000;
  const camZ = F.trav * 3000, loop = 16000;
  const dockT = sstep(C.dock - 0.2, C.dock + 0.35, T);
  glow(cx, cy, 800, YL, 0.15 + 0.5 * F.it + 0.5 * dockT);
  const P = (x, y, z) => [cx + (x * f) / z, cy + (y * f) / z];
  // the four tower edges converging on the vanishing point (we look straight up)
  for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) { neonPath([P(sx * 800, sy * 800, 70), P(sx * 800, sy * 800, 12000)], YL, 2.5, 0.9); neonPath([P(sx * 800, sy * 800, 70), P(sx * 800, sy * 800, 12000)], CY, 1, 0.6); }
  // floors rushing past
  const floors = []; for (let j = 0; j < 40; j++) { const z = ((j * 400 - camZ) % loop + loop) % loop + 60; floors.push(z); } floors.sort((a, b) => b - a);
  for (const z of floors) { const a = clamp(1 - z / 7000, 0, 1); const q = [P(-800, -800, z), P(800, -800, z), P(800, 800, z), P(-800, 800, z)]; neonPath(q, a > 0.5 ? CY : VI, 2, a * 0.9, true); for (let k = 0; k < 4; k++) { const w = (f / z) * 120; if (ihash(Math.floor(z / 400), k, 90) > 0.5) { const p = P([-800, 800, 800, -800][k] * 0.6 + [1, -1, -1, 1][k] * 200, [-800, -800, 800, 800][k] * 0.6, z); ctx.fillStyle = rgba(YL, a * 0.6); ctx.fillRect(p[0] - w / 2, p[1] - w / 6, w, w / 3); } } }
  // the hive at the top: a hexagon that opens as we arrive
  const hz = Math.max(80, 4000 - u * 3900); const hr = (f / hz) * 900;
  const openAmt = dockT;
  for (let ring = 0; ring < 3; ring++) { const hex = []; const r = hr * (1 - ring * 0.25); for (let k = 0; k <= 6; k++) hex.push([cx + Math.cos((k / 6) * TAU + Math.PI / 6) * r, cy + Math.sin((k / 6) * TAU + Math.PI / 6) * r]); neonPath(hex, ring === 0 ? YL : MG, 3 - ring * 0.6, 0.9, true); }
  glow(cx, cy, hr * 0.8, YL, 0.35 + 0.6 * F.on + openAmt);
  // iris petals opening
  for (let k = 0; k < 6; k++) { const a0 = (k / 6) * TAU + Math.PI / 6, a1 = a0 + TAU / 6; const r = hr * 0.5 * (1 - openAmt); const tri = [[cx, cy], [cx + Math.cos(a0) * r, cy + Math.sin(a0) * r], [cx + Math.cos(a1) * r, cy + Math.sin(a1) * r]]; fillDark(tri, 0.9, [14, 12, 8]); neonPath(tri, YL, 1.5, 0.8, true); }
  speedLines(F, cx, cy, 0.5 + 0.5 * F.dens);
  // drone from behind, climbing: steer with pitch
  const dx = cx + (F.alt - 0.5) * 500 * (1 - u * 0.7), dy = H * 0.7 - u * 250 + Math.sin(T * 6) * 5;
  trail(F, (t, k) => cx + (altAt(t) - 0.5) * 500 * (1 - u * 0.7) - k * 6, (t, k) => H * 0.7 - u * 250 + k * 34);
  const sc = 0.95 - u * 0.5;
  drone(F, dx, dy, sc, -Math.PI / 2 + (F.alt - altAt(T - 0.06)) * 2);
  hud(F, 'SECTOR 7 · VERTICAL CLIMB', `ETA ${Math.max(0, (C.dock - T)).toFixed(1)}s`);
}
function sceneDock(F, u, C) {
  // delivered: the dock seals, a stamp, credits
  const T = F.t, since = T - C.dock;
  ctx.fillStyle = '#05040c'; ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H * 0.42;
  const seal = sstep(0.1, 0.9, since);
  glow(cx, cy, 900, YL, 0.5 * (1 - seal) + 0.12);
  for (let ring = 0; ring < 4; ring++) { const r = 180 + ring * 80 + (1 - seal) * 60; const hex = []; for (let k = 0; k <= 6; k++) hex.push([cx + Math.cos((k / 6) * TAU + Math.PI / 6) * r, cy + Math.sin((k / 6) * TAU + Math.PI / 6) * r]); neonPath(hex, ring % 2 ? MG : YL, 2.5 - ring * 0.4, 0.9 - ring * 0.15, true); }
  for (let k = 0; k < 6; k++) { const a0 = (k / 6) * TAU + Math.PI / 6, a1 = a0 + TAU / 6; const r = 180 * seal; const tri = [[cx, cy], [cx + Math.cos(a0) * r, cy + Math.sin(a0) * r], [cx + Math.cos(a1) * r, cy + Math.sin(a1) * r]]; fillDark(tri, 0.95, [14, 12, 8]); neonPath(tri, YL, 1.5, 0.9, true); }
  if (seal < 0.6) drone(F, cx, cy + 20, 0.8 * (1 - seal), -Math.PI / 2, { package: false });
  // stamp
  const st = sstep(0.5, 0.9, since);
  if (st > 0) { ctx.save(); ctx.translate(cx, H * 0.78); ctx.rotate(-0.06); ctx.scale(1 + (1 - st) * 0.8, 1 + (1 - st) * 0.8); neonText('DELIVERED', 0, 0, 120, YL, st); ctx.restore(); }
  monoText('PACKAGE 0x2F3A · HIVE 7 · 00:01:13', cx, H * 0.88, 26, CY, 0.7 * st, 'center');
  const cr = sstep(1.6, 2.6, since);
  if (cr > 0) { ctx.fillStyle = rgba([5, 4, 12], cr * 0.85); ctx.fillRect(0, 0, W, H); neonText(CONFIG.title.toUpperCase(), cx, H * 0.4, 70, CY, cr); monoText(CONFIG.composer.toUpperCase(), cx, H * 0.5, 26, WH, 0.7 * cr, 'center'); monoText(CONFIG.performer.toUpperCase(), cx, H * 0.55, 22, WH, 0.55 * cr, 'center'); monoText(CONFIG.credit.toUpperCase(), cx, H * 0.62, 22, MG, 0.7 * cr, 'center'); }
}
function hud(F, label, value) {
  monoText(label, 40, 46, 24, CY, 0.8);
  monoText(value, W - 40, 46, 24, YL, 0.8, 'right');
  // a tiny spectrum readout, bottom left
  ctx.globalCompositeOperation = 'lighter';
  for (let b = 0; b < A.BINS; b++) { const v = F.spec[b]; ctx.fillStyle = rgba(CY, 0.35 + 0.5 * v); ctx.fillRect(40 + b * 9, H - 40, 6, -(6 + v * 50)); }
  ctx.globalCompositeOperation = 'source-over';
  monoText(`${Math.floor(F.t / 60)}:${String(Math.floor(F.t % 60)).padStart(2, '0')}.${String(Math.floor((F.t % 1) * 10))}`, W - 40, H - 46, 22, WH, 0.5, 'right');
}
function titleIntro(F) {
  const a = sstep(0.3, 1.2, F.t) * (1 - sstep(2.4, 3.0, F.t));
  if (a <= 0) return;
  const flick = noise2(F.t * 25, 5) > 0.1 ? 1 : 0.3;
  neonText(CONFIG.title.toUpperCase(), W / 2, H * 0.09, 44, CY, a * flick);
}

const SCENES = [
  ['hive', (C) => 0, sceneHive],
  ['canyon', (C) => C.launch, sceneCanyon],
  ['underpass', (C) => C.underpass, sceneUnderpass],
  ['market', (C) => C.market, sceneMarket],
  ['alley', (C) => C.alley, sceneAlley],
  ['glide', (C) => C.glide, sceneGlide],
  ['climb', (C) => C.climb, sceneClimb],
  ['dock', (C) => C.dock, sceneDock],
];

function draw(t) {
  const F = frameAt(t);
  const C = cues();
  // find the scene
  let si = 0; for (let k = 0; k < SCENES.length; k++) if (t >= SCENES[k][1](C)) si = k;
  const start = SCENES[si][1](C), end = si + 1 < SCENES.length ? SCENES[si + 1][1](C) : A.duration;
  const u = clamp((t - start) / Math.max(0.001, end - start), 0, 1);
  const sinceCut = t - start;
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  // camera bump on accents
  const bump = F.acc * 14 + (sinceCut < 0.15 ? 20 : 0);
  ctx.save();
  ctx.translate((noise2(t * 50, 1) - 0.5) * bump, (noise2(t * 47, 2) - 0.5) * bump);
  const zoom = 1 + 0.02 * F.on + (sinceCut < 0.25 ? 0.06 * (1 - sinceCut / 0.25) : 0);
  ctx.translate(W / 2, H / 2); ctx.scale(zoom, zoom); ctx.translate(-W / 2, -H / 2);
  SCENES[si][2](F, u, C);
  ctx.restore();
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  // bloom: downsample, blur, add back
  bctxA.setTransform(1, 0, 0, 1, 0, 0); bctxA.filter = 'none'; bctxA.globalCompositeOperation = 'source-over'; bctxA.clearRect(0, 0, W / 4, H / 4); bctxA.drawImage(canvas, 0, 0, W / 4, H / 4);
  bctxB.setTransform(1, 0, 0, 1, 0, 0); bctxB.clearRect(0, 0, W / 4, H / 4); bctxB.filter = 'blur(6px)'; bctxB.drawImage(bloomA, 0, 0); bctxB.filter = 'none';
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.5 + 0.3 * F.on; ctx.drawImage(bloomB, 0, 0, W, H);
  // chromatic aberration on accents and cuts
  const ab = Math.max(F.acc, sinceCut < 0.2 ? 1 - sinceCut / 0.2 : 0);
  if (ab > 0.08) { ctx.globalAlpha = 0.35 * ab; ctx.drawImage(bloomA, -14 * ab, 0, W, H); ctx.drawImage(bloomA, 14 * ab, 0, W, H); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // glitch slices on strong accents
  if (F.acc > 0.5) { const n = 3; for (let k = 0; k < n; k++) { const y = ihash(F.i, k, 5) * H, h = 10 + ihash(F.i, k, 6) * 60, dx = (ihash(F.i, k, 7) - 0.5) * 80 * F.acc; ctx.drawImage(canvas, 0, (y * canvas.height) / H, canvas.width, (h * canvas.height) / H, dx, y, W, h); } }
  scanlines(0.10);
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 1.0); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  // cut flash
  if (sinceCut < 0.08 && si > 0) { ctx.fillStyle = rgba(WH, 0.8 * (1 - sinceCut / 0.08)); ctx.fillRect(0, 0, W, H); }
  titleIntro(F);
  if (t < 0.6) { ctx.fillStyle = rgba([0, 0, 0], 1 - sstep(0, 0.6, t)); ctx.fillRect(0, 0, W, H); }
}

// ============================================================ loading & playback
const overlay = document.getElementById('overlay'), msg = document.getElementById('msg');
let audioEl = null, raf = 0, currentUrl = null;
async function loadBuffer(ab) { const off = new OfflineAudioContext(1, 44100, 44100); const buf = await off.decodeAudioData(ab.slice(0)); A = analyse(buf); return A; }
async function loadUrl(url) {
  msg.textContent = 'Listening to the music…';
  if (url.startsWith('data:')) { const bin = atob(url.slice(url.indexOf(',') + 1)); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); await loadBuffer(bytes.buffer); currentUrl = URL.createObjectURL(new Blob([bytes], { type: url.slice(5, url.indexOf(';')) })); }
  else { const res = await fetch(url); await loadBuffer(await res.arrayBuffer()); currentUrl = url; }
  msg.textContent = `${Math.round(A.duration)}s analysed · ${Array.from(A.onset).filter((v) => v > 0).length} notes found`;
}
function startPlayback() {
  if (!A) return;
  if (audioEl) audioEl.pause();
  audioEl = new Audio(currentUrl); audioEl.play(); overlay.classList.add('hidden'); cancelAnimationFrame(raf);
  const loop = () => { raf = requestAnimationFrame(loop); const t = audioEl.currentTime; draw(t); document.getElementById('bar').style.width = `${(t / A.duration) * 100}%`; if (audioEl.ended) { overlay.classList.remove('hidden'); cancelAnimationFrame(raf); } };
  loop();
}
document.getElementById('play').addEventListener('click', async () => { if (!A) await loadUrl(CONFIG.audio); startPlayback(); });
document.getElementById('file').addEventListener('change', async (e) => { const f = e.target.files[0]; if (!f) return; msg.textContent = 'Listening to the music…'; await loadBuffer(await f.arrayBuffer()); if (currentUrl && currentUrl.startsWith('blob:')) URL.revokeObjectURL(currentUrl); currentUrl = URL.createObjectURL(f); startPlayback(); });
document.fonts && Promise.all([document.fonts.load('800 40px Orbitron'), document.fonts.load('20px "Share Tech Mono"')]).then(() => { fontReady = document.fonts.check('800 40px Orbitron'); }).catch(() => {});
window.addEventListener('keydown', (e) => { if (e.code === 'Space' && audioEl) { e.preventDefault(); audioEl.paused ? audioEl.play() : audioEl.pause(); } });
(async () => { try { await loadUrl(CONFIG.audio); draw(cues().market + 4); } catch (e) { msg.textContent = 'Drop in an audio file to begin.'; } })();

window.MV = {
  async load(url) { await loadUrl(url); return { frames: A.frames, duration: A.duration, end: A.endFrame / A.fps }; },
  renderFrame(i, fps) { document.body.classList.add('render'); draw(i / fps); return true; },
  jpeg(q) { return canvas.toDataURL('image/jpeg', q); },
  async fonts() { try { await Promise.all([document.fonts.load('800 40px Orbitron'), document.fonts.load('500 40px Orbitron'), document.fonts.load('20px "Share Tech Mono"')]); } catch (e) {} fontReady = document.fonts.check('800 40px Orbitron'); return fontReady; },
  analysis() { return { duration: A.duration, notes: Array.from(A.onset).filter((v) => v > 0).length, cues: cues() }; },
};
</script>
