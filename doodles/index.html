  :root { --bg: #efe6d6; --ink: #2b2a33; --muted: rgba(43,42,51,0.6); --accent: #e0655a; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: "Patrick Hand", "Comic Sans MS", cursive, sans-serif; }
  body { display: grid; place-items: center; overflow: hidden; }
  .stage { position: relative; width: 100vw; height: 100vh; display: grid; place-items: center; }
  canvas { display: block; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; background: #efe6d6; }
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(239,230,214,0.92); transition: opacity 0.5s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .card { text-align: center; display: grid; gap: 16px; padding: 24px; max-width: 640px; }
  .card h1 { font-family: "Gochi Hand", "Patrick Hand", cursive; font-weight: 400; font-size: clamp(30px, 5vw, 58px); margin: 0; }
  .card p { margin: 0; color: var(--muted); font-size: 20px; line-height: 1.5; }
  .card button { justify-self: center; background: #fff; color: var(--ink); border: 2px solid var(--ink); border-radius: 999px; padding: 12px 34px; font: inherit; font-size: 22px; cursor: pointer; box-shadow: 3px 3px 0 var(--ink); }
  .card button:hover, .card button:focus-visible { background: var(--accent); color: #fff; outline: none; }
  .card label { color: var(--muted); font-size: 16px; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }
  .card input { display: none; }
  .hud { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(0,0,0,0.08); opacity: 0; transition: opacity 0.3s; }
  .stage:hover .hud { opacity: 1; }
  .hud i { display: block; height: 100%; width: 0; background: var(--accent); }
  body.render canvas { width: 1920px; height: 1080px; max-width: none; max-height: none; }
  body.render .overlay, body.render .hud { display: none; }
</style>
</head>
<body>
<div class="stage">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div class="hud"><i id="bar"></i></div>
  <div class="overlay" id="overlay">
    <div class="card">
      <h1>Doodles for the Apprentice</h1>
      <p>Four photographs, one spell. Every doodle is drawn in JavaScript, stroke by stroke, on the notes of Dukas's Sorcerer's Apprentice.</p>
      <button id="play">Play</button>
      <label>or drop in any audio file <input id="file" type="file" accept="audio/*" /></label>
      <p id="msg"></p>
    </div>
  </div>
</div>

    const px = lerp(-200, 260, pawIn), py = 900;
    ctx.save(); ctx.globalAlpha = 1 - erase;
    ink(circ(px, py, 70, 20, 60), { w: 4, seed: 800 }); pencil(circ(px, py, 70, 20, 60), [240, 225, 200], 0.9, 80);
    for (let k = 0; k < 4; k++) { const a = -Math.PI * 0.9 + k * 0.45; const fx = px + Math.cos(a) * 80, fy = py + Math.sin(a) * 70; const snapped = snapT > 0 && k === 1 ? -30 : 0; ink(circ(fx, fy + snapped, 26, 12, 22), { w: 3.4, seed: 810 + k }); pencil(circ(fx, fy + snapped, 26, 12, 22), [240, 225, 200], 0.9, 90 + k); }
    ctx.restore();
  }
  if (snapT > 0) {
    const ring = clamp(snapT / 0.5, 0, 1);
    for (let k = 0; k < 3; k++) ink(circ(300, 820, (50 + k * 70) * (0.5 + ring), 24), { w: 4, a: (1 - ring) * 0.9, seed: 830 + k, closed: true, col: PENCIL.yellow });
    lettering('SNAP!', 520, 720, 120, INK, { rot: -0.08, outline: 'rgba(255,255,255,0.9)', a: 1 - sstep(0.8, 1.2, snapT) });
    // the eraser sweeps across
    if (erase > 0 && erase < 1) { const ex = lerp(-300, W + 300, erase); ctx.save(); ctx.translate(ex, 500); ctx.rotate(0.3); pencil([[-140, -60], [140, -60], [140, 60], [-140, 60]], PENCIL.pink, 0.9, 99); ink([[-140, -60], [140, -60], [140, 60], [-140, 60]], { w: 4, closed: true, seed: 840 }); ctx.restore(); }
    ctx.fillStyle = `rgba(255,255,255,${0.9 * (1 - clamp(snapT / 0.25, 0, 1))})`; ctx.fillRect(0, 0, W, H);
  }
  if (since < 3) lettering('!!!', 1500, 200, 100, PENCIL.red, { rot: 0.1, a: 1 - since / 3 });
  lettering('and the cat was the master all along', 70, H - 50, 34, [90, 85, 110], { font: 'Patrick Hand', align: 'left', a: sstep(0, 1.5, since) * (1 - erase) });
}
function sceneEnd(F, u, C) {
  paper(PAPER.cream);
  const T = F.t - C.end;
  pinboard(F, 1, T > 0.6);
  lettering(CONFIG.title, W / 2, 800, 76, INK, { a: sstep(0.2, 1, T) });
  lettering(CONFIG.composer + '  ·  ' + CONFIG.credit, W / 2, 870, 34, [90, 85, 110], { font: 'Patrick Hand', a: sstep(0.4, 1.2, T) });
  lettering('the end', W / 2, 960, 60, INK, { a: sstep(1.2, 2, T) });
}
const SCENES = [['intro', (C) => 0, sceneIntro], ['balloon', (C) => C.balloon, sceneBalloon], ['choir', (C) => C.choir, sceneChoir], ['beach', (C) => C.beach, sceneBeach], ['launch', (C) => C.launch, sceneLaunch], ['master', (C) => C.master, sceneMaster], ['end', (C) => C.end, sceneEnd]];
function draw(t) {
  const F = frameAt(t); const C = cues(); boil = Math.floor(t * 8);
  let si = 0; for (let k = 0; k < SCENES.length; k++) if (t >= SCENES[k][1](C)) si = k;
  const start = SCENES[si][1](C), end = si + 1 < SCENES.length ? SCENES[si + 1][1](C) : A.duration;
  const u = clamp((t - start) / Math.max(0.001, end - start), 0, 1); const sinceCut = t - start;
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.save(); const zoom = 1 + 0.012 * F.it + (sinceCut < 0.3 ? 0.03 * (1 - sinceCut / 0.3) : 0); ctx.translate(W / 2, H / 2); ctx.scale(zoom, zoom); ctx.translate(-W / 2, -H / 2);
  SCENES[si][2](F, u, C);
  ctx.restore(); ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  if (sinceCut < 0.12 && si > 0) { ctx.fillStyle = `rgba(255,252,245,${0.85 * (1 - sinceCut / 0.12)})`; ctx.fillRect(0, 0, W, H); }
  if (t < 0.8) { ctx.fillStyle = `rgba(240,231,210,${1 - sstep(0, 0.8, t)})`; ctx.fillRect(0, 0, W, H); }
}

// ============================================================ loading & playback
const overlay = document.getElementById('overlay'), msg = document.getElementById('msg');
let audioEl = null, raf = 0, currentUrl = null;
function loadImages() { return Promise.all(Object.keys(PHOTO_SRC).map((k) => new Promise((res) => { const im = new Image(); im.onload = () => { IMG[k] = im; res(); }; im.onerror = () => res(); im.src = PHOTO_SRC[k]; }))); }
async function loadBuffer(ab) { const off = new OfflineAudioContext(1, 44100, 44100); const buf = await off.decodeAudioData(ab.slice(0)); A = analyse(buf); return A; }
async function loadUrl(url) {
  msg.textContent = 'Listening to the music…';
  if (url.startsWith('data:')) { const bin = atob(url.slice(url.indexOf(',') + 1)); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); await loadBuffer(bytes.buffer); currentUrl = URL.createObjectURL(new Blob([bytes], { type: url.slice(5, url.indexOf(';')) })); }
  else { const res = await fetch(url); await loadBuffer(await res.arrayBuffer()); currentUrl = url; }
  msg.textContent = `${Math.round(A.duration)}s analysed · ${A.onCount[A.frames - 1]} notes to draw on`;
}
function startPlayback() {
  if (!A) return; if (audioEl) audioEl.pause();
  audioEl = new Audio(currentUrl); audioEl.play(); overlay.classList.add('hidden'); cancelAnimationFrame(raf);
  const loop = () => { raf = requestAnimationFrame(loop); const t = audioEl.currentTime; draw(t); document.getElementById('bar').style.width = `${(t / A.duration) * 100}%`; if (audioEl.ended) { overlay.classList.remove('hidden'); cancelAnimationFrame(raf); } };
  loop();
}
document.getElementById('play').addEventListener('click', async () => { if (!A) await loadUrl(CONFIG.audio); startPlayback(); });
document.getElementById('file').addEventListener('change', async (e) => { const f = e.target.files[0]; if (!f) return; msg.textContent = 'Listening to the music…'; await loadBuffer(await f.arrayBuffer()); if (currentUrl && currentUrl.startsWith('blob:')) URL.revokeObjectURL(currentUrl); currentUrl = URL.createObjectURL(f); startPlayback(); });
async function loadFonts() { try { await Promise.all([document.fonts.load('40px "Gochi Hand"'), document.fonts.load('40px "Patrick Hand"')]); } catch (e) {} fontReady = document.fonts.check('40px "Gochi Hand"'); return fontReady; }
window.addEventListener('keydown', (e) => { if (e.code === 'Space' && audioEl) { e.preventDefault(); audioEl.paused ? audioEl.play() : audioEl.pause(); } });
(async () => { try { await loadImages(); await loadUrl(CONFIG.audio); await loadFonts(); draw(cues().balloon + 20); } catch (e) { msg.textContent = 'Drop in an audio file to begin.'; } })();
window.MV = {
  async load(url) { await loadImages(); await loadUrl(url); return { frames: A.frames, duration: A.duration, end: A.endFrame / A.fps }; },
  fonts: loadFonts,
  renderFrame(i, fps) { document.body.classList.add('render'); draw(i / fps); return true; },
  jpeg(q) { return canvas.toDataURL('image/jpeg', q); },
  analysis() { return { duration: A.duration, notes: A.onCount[A.frames - 1], cues: cues() }; },
};
</script>
